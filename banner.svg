<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Safia Ait Hammoud - AI and Data Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#7f5af0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- Left network decoration -->
  <g stroke="#00c6ff" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="40" y1="60" x2="110" y2="110"/>
    <line x1="40" y1="60" x2="90" y2="30"/>
    <line x1="110" y1="110" x2="180" y2="70"/>
    <line x1="110" y1="110" x2="70" y2="180"/>
    <line x1="110" y1="110" x2="170" y2="160"/>
    <line x1="180" y1="70" x2="230" y2="120"/>
    <line x1="170" y1="160" x2="230" y2="120"/>
    <line x1="170" y1="160" x2="140" y2="225"/>
    <line x1="70" y1="180" x2="140" y2="225"/>
  </g>
  <g fill="#00c6ff">
    <circle cx="40" cy="60" r="5" opacity="0.7"/>
    <circle cx="90" cy="30" r="4" opacity="0.6"/>
    <circle cx="110" cy="110" r="7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="70" r="5" opacity="0.7"/>
    <circle cx="70" cy="180" r="5" opacity="0.7"/>
    <circle cx="170" cy="160" r="6"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="120" r="4" opacity="0.6"/>
    <circle cx="140" cy="225" r="4" opacity="0.6"/>
  </g>

  <!-- Right network decoration -->
  <g stroke="#7f5af0" stroke-width="1.2" opacity="0.4" fill="none">
    <line x1="1160" y1="200" x2="1090" y2="150"/>
    <line x1="1160" y1="200" x2="1110" y2="230"/>
    <line x1="1090" y1="150" x2="1020" y2="190"/>
    <line x1="1090" y1="150" x2="1130" y2="80"/>
    <line x1="1090" y1="150" x2="1030" y2="100"/>
    <line x1="1020" y1="190" x2="970" y2="140"/>
    <line x1="1030" y1="100" x2="970" y2="140"/>
    <line x1="1030" y1="100" x2="1060" y2="35"/>
    <line x1="1130" y1="80" x2="1060" y2="35"/>
  </g>
  <g fill="#7f5af0">
    <circle cx="1160" cy="200" r="5" opacity="0.7"/>
    <circle cx="1110" cy="230" r="4" opacity="0.6"/>
    <circle cx="1090" cy="150" r="7"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="190" r="5" opacity="0.7"/>
    <circle cx="1130" cy="80" r="5" opacity="0.7"/>
    <circle cx="1030" cy="100" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="140" r="4" opacity="0.6"/>
    <circle cx="1060" cy="35" r="4" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="600" y="120" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Safia Ait Hammoud</text>
  <text x="600" y="164" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#9fe8ff" letter-spacing="1.2">AI &amp; Data Engineering  ·  RAG  ·  ML  ·  Streaming</text>
  <rect x="520" y="188" width="160" height="4" rx="2" fill="url(#accent)"/>
</svg>
